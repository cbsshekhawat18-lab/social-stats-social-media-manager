# ============================================================================
#  Social Stats — one-command self-hosted stack
#
#      cp .env.docker.example .env.docker   # fill in SECRET_KEY etc. first
#      docker compose --env-file .env.docker up -d --build   # build from source
#        — or pull the prebuilt multi-arch images instead of building:
#      docker compose --env-file .env.docker pull
#      docker compose --env-file .env.docker up -d
#      docker compose --env-file .env.docker exec backend \
#          python manage.py demo_setup --i-know-this-is-not-production   # optional demo data
#
#  App:            http://localhost:3000          (React SPA + API proxy)
#  Django admin:   http://localhost:8000/admin/   (backend service, direct)
#
#  Configuration lives in .env.docker (template: .env.docker.example). Pass
#  it with --env-file on EVERY compose command: the ${VAR:?…} checks below
#  are resolved from it, and compose refuses to run if a required value is
#  missing. (Tip: `export COMPOSE_ENV_FILES=.env.docker` saves the flag on
#  recent Compose versions.) DB/Redis wiring is fixed below. See
#  docs/GETTING_STARTED.md and docs/GOING_LIVE.md.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialstats
      POSTGRES_USER: socialstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialstats}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialstats"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/cbsshekhawat18-lab/social-stats-backend:latest
    build: ./backend
    env_file:
      - path: .env.docker
        required: false
    environment: &backend-env
      DEBUG: "False"
      # ── From .env.docker (required → compose stops with this message) ──
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (50+ random chars) in .env.docker and run compose with --env-file .env.docker}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?Set FIELD_ENCRYPTION_KEYS (a Fernet key) in .env.docker and run compose with --env-file .env.docker}
      # ── From .env.docker (optional, local-friendly defaults) ──
      # Keep localhost listed: the healthcheck below calls http://localhost:8000.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Plain HTTP inside the network; set all three to True in .env.docker
      # when a TLS-terminating proxy sits in front.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      # ── Stack wiring (fixed) ──
      DB_NAME: socialstats
      DB_USER: socialstats
      DB_PASSWORD: ${POSTGRES_PASSWORD:-socialstats}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      # One reverse proxy (the frontend nginx) appends to X-Forwarded-For.
      TRUSTED_PROXY_COUNT: "1"
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 dashboard.asgi:application"
    volumes:
      - media:/app/media
    ports:
      # Direct API + Django admin access, loopback only. Keep it that way:
      # with TRUSTED_PROXY_COUNT=1 anything reaching this port directly can
      # choose its own X-Forwarded-For.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/services/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: ghcr.io/cbsshekhawat18-lab/social-stats-backend:latest
    build: ./backend
    env_file:
      - path: .env.docker
        required: false
    environment: *backend-env
    command: celery -A dashboard worker -l info
    volumes:
      - media:/app/media
    depends_on:
      backend:
        condition: service_healthy

  beat:
    image: ghcr.io/cbsshekhawat18-lab/social-stats-backend:latest
    build: ./backend
    env_file:
      - path: .env.docker
        required: false
    environment: *backend-env
    command: celery -A dashboard beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ghcr.io/cbsshekhawat18-lab/social-stats-frontend:latest
    build:
      context: ./frontend
      args:
        # Build-time only: "true" adds the one-click demo logins to /login.
        REACT_APP_SHOW_DEMO: ${REACT_APP_SHOW_DEMO:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
