# Social Stats — single-origin nginx for the docker-compose stack.
# Serves the React build and proxies API + WebSockets + media to the
# backend service (service name "backend" on the compose network).

# Uploaded media: only raster images and video may render inline. Everything
# else (PDF, and any legacy SVG/HTML already on the volume) is forced to
# download. First matching regex wins, so SVG is listed before image/*.
map $sent_http_content_type $media_content_disposition {
    ~*^image/svg  "attachment";
    ~*^image/     "";
    ~*^video/     "";
    default       "attachment";
}

# The SPA opens its WebSocket on the page's own origin (ws:// or wss:// —
# behind a TLS-terminating proxy this nginx only sees http). Host comes from
# the client, so only a plain host[:port] is echoed into the CSP (anything
# else, e.g. a bracketed IPv6 literal, falls back to 'self').
map $http_host $csp_ws_sources {
    ~^[A-Za-z0-9.:-]+$  "ws://$http_host wss://$http_host";
    default             "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSockets (Channels)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Uploaded media (logos, avatars, composer assets) — served from the
    # shared volume; Django only serves /media/ itself when DEBUG=True.
    # User-controlled content: lock it down so a hostile upload can never run
    # script on this origin, even if it slipped past backend validation.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition $media_content_disposition always;
    }

    # Hashed static assets — cache hard
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA fallback + document security headers.
    #   script-src 'self'   — the build has no inline <script> (Dockerfile sets
    #                         INLINE_RUNTIME_CHUNK=false). Enabling Plausible
    #                         (REACT_APP_PLAUSIBLE_DOMAIN) needs its host added
    #                         to script-src and connect-src.
    #   style-src           — 'unsafe-inline' for CSS-in-JS (react-hot-toast,
    #                         framer-motion) + Google Fonts CSS.
    #   img-src / media-src — post thumbnails and avatars come from platform CDNs.
    # (add_header in a location replaces server-level ones — keep these here.)
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' $csp_ws_sources; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()" always;
    }
}
