name: Tests

# Runs on every PR + push to main/develop. Two parallel jobs:
#   • backend  — Django unit + integration tests via `manage.py test`.
#   • frontend — `npm run build` for type/import safety, then `npm test`
#                (Jest + React Testing Library).
#
# Both jobs are read-only — no deploys, no secrets uploaded. The existing
# `security.yml` workflow handles SAST + dep-CVE scans on the same triggers.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Backend — Django test suite (230+ tests across all stages)
  # ───────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     socialstats
          POSTGRES_PASSWORD: socialstats
          POSTGRES_DB:       socialstats_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialstats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements-dev.txt — testing extras (pytest, factories, etc.)
          # Skip if absent; manage.py test uses the stdlib runner anyway.
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Django tests
        working-directory: backend
        env:
          # Pointing at the service containers above. settings.py reads the
          # discrete DB_* vars (it has no DATABASE_URL parser).
          DB_NAME:            socialstats_test
          DB_USER:            socialstats
          DB_PASSWORD:        socialstats
          DB_HOST:            localhost
          DB_PORT:            "5432"
          CELERY_BROKER_URL:  redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: dashboard.settings
          SECRET_KEY:         test-secret-not-for-prod
          DEBUG:              "False"
          ANTHROPIC_API_KEY:  ""   # AI tests stub the client
          ALLOWED_HOSTS:      "*"
        run: |
          python manage.py test social_stats.tests --verbosity=1


  # ───────────────────────────────────────────────────────────────────────
  # Frontend — build + Jest/RTL unit tests
  # ───────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build + Jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Production build
        working-directory: frontend
        env:
          # CI=true makes CRA treat warnings as errors (catches regressions).
          CI: "true"
        run: npm run build

      - name: Run Jest tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test

  # ───────────────────────────────────────────────────────────────────────
  # Docker — build both images and boot the compose stack end-to-end
  # ───────────────────────────────────────────────────────────────────────
  docker:
    name: Docker — compose stack boots
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/services/ > /dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "backend never became healthy"; docker compose logs backend | tail -50; exit 1

      - name: Frontend serves the SPA through nginx
        run: |
          curl -fsS http://localhost:3000/ | grep -qi "<title>" || { docker compose logs frontend | tail -30; exit 1; }
          # API reachable through the same-origin proxy (401 = auth wall, which is correct)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me/)
          [ "$code" = "401" ] || { echo "expected 401 from /api/auth/me/, got $code"; exit 1; }

      - name: Seed demo data inside the container
        run: docker compose exec -T backend python manage.py demo_setup

      - name: Worker and beat are running
        run: |
          docker compose ps --format '{{.Service}} {{.State}}' | tee /tmp/ps.txt
          grep -q "worker running" /tmp/ps.txt
          grep -q "beat running" /tmp/ps.txt

      - name: Teardown
        if: always()
        run: docker compose down -v
