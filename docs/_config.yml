title: Social Stats — Open-Source Social Media Management Platform
description: >-
  Open-source social media management & marketing platform — scheduler, content
  calendar, cross-platform analytics dashboards, unified inbox, click-to-WhatsApp
  bot builder, and an AI assistant. Self-hosted Django + React. A Hootsuite /
  Buffer / Sprout Social alternative.

# Canonical site location — required for correct canonical URLs, Open Graph
# tags (jekyll-seo-tag) and absolute links in sitemap.xml (jekyll-sitemap).
url: https://cbsshekhawat18-lab.github.io
baseurl: /social-stats-social-media-manager

lang: en
logo: /screenshot.png

# Social preview image used by jekyll-seo-tag for Open Graph / Twitter cards.
image: /screenshot.png

github:
  repository_url: https://github.com/cbsshekhawat18-lab/social-stats-social-media-manager

theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Give every doc page a sensible default title/description for search engines;
# individual pages override via their own front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
